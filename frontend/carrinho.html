<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="auth-container">

<div class="auth-card">

<h1>Cadastro</h1>

<p>Crie sua conta.</p>

<form id="formCadastro">

<input
type="text"
id="nome"
placeholder="Nome Completo"
required>

<input
type="email"
id="email"
placeholder="E-mail"
required>

<input
type="text"
id="login"
placeholder="Login"
required>

<input
type="password"
id="senha"
placeholder="Senha"
required>

<button type="submit">

Cadastrar

</button>

</form>

<p>

Já possui conta?

<a href="login.html">

Entrar

</a>

</p>

</div>

</div>

<script type="module" src="js/cadastro.js"></script>

</body>

</html>
